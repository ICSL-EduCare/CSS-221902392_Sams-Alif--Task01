<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Padding</title>
    <style>
        div { 
            padding: 30px; 
            border: 1px solid black; 
            background-color: lightgreen; 
        }
    </style>
</head>
<body>
    <div>This div element has a padding of 30px on all sides.</div>
</body>
</html>
