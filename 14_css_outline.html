<!doctype html>
<html lang="en">
  <head>
    <title>CSS Outline</title>
    <style>
      p {
        border: 2px solid black;
        outline: 3px dashed red;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <p>This element has a 2px black border and a 3px dashed red outline.</p>
  </body>
</html>
