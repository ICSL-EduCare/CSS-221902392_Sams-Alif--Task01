<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Shadows</title>
    <style>
        h1 { text-shadow: 2px 2px 5px red; }
        div { width: 300px; height: 100px; padding: 15px; background-color: yellow; box-shadow: 10px 10px 5px lightblue; }
    </style>
</head>
<body>
    <h1>Text Shadow Effect</h1>
    <div>Box Shadow Effect</div>
</body>
</html>
