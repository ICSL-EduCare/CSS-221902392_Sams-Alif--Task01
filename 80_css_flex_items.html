<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Flex Items</title>
    <style>
        .flex-container { display: flex; background-color: lightgrey; height: 150px; align-items: center; }
        .item1 { flex-grow: 2; background-color: tomato; padding: 20px; margin: 5px; }
        .item2 { flex-grow: 1; background-color: lightblue; padding: 20px; margin: 5px; }
    </style>
</head>
<body>
    <h2>Flex Items Properties</h2>
    <div class="flex-container">
        <div class="item1">Grows 2x</div>
        <div class="item2">Grows 1x</div>
    </div>
</body>
</html>
