<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Accessibility</title>
    <style>
        button:focus { outline: 3px solid blue; background-color: yellow; }
    </style>
</head>
<body>
    <p>Accessibility ensures websites are usable for everyone. Press 'Tab' to focus on the button.</p>
    <button>Focusable Button</button>
</body>
</html>
