<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The viewport meta tag is crucial for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD Viewport</title>
</head>
<body>
    <h2>Setting The Viewport</h2>
    <p>A viewport element gives the browser instructions on how to control the page's dimensions and scaling.</p>
</body>
</html>
