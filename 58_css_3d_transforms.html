<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS 3D Transforms</title>
    <style>
        div { width: 100px; height: 100px; background-color: lightblue; border: 1px solid black; transform: rotateX(150deg); margin: 50px; }
    </style>
</head>
<body>
    <div>This div is rotated 150 degrees across the X-axis.</div>
</body>
</html>
