<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Box Sizing</title>
    <style>
        .box1 { width: 300px; height: 100px; border: 10px solid blue; padding: 20px; }
        .box2 { width: 300px; height: 100px; border: 10px solid red; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Box Sizing: border-box</h2>
    <div class="box1">Without border-box, width expands.</div>
    <div class="box2">With border-box, width stays exactly 300px.</div>
</body>
</html>
