<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Flex Container</title>
    <style>
        .flex-container { display: flex; flex-direction: row-reverse; justify-content: space-between; background-color: coral; }
        .flex-container > div { background-color: white; padding: 20px; margin: 10px; font-size: 20px; }
    </style>
</head>
<body>
    <h2>Flex Container Properties</h2>
    <p>Using flex-direction: row-reverse and justify-content: space-between.</p>
    <div class="flex-container">
        <div>Box A</div>
        <div>Box B</div>
        <div>Box C</div>
    </div>
</body>
</html>
