<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Forms</title>
    <style>
        input[type=text] { width: 100%; padding: 12px 20px; margin: 8px 0; box-sizing: border-box; border: 2px solid green; border-radius: 4px; }
    </style>
</head>
<body>
    <form>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Your name..">
    </form>
</body>
</html>
