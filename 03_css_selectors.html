<!doctype html>
<html lang="en">
  <head>
    <title>CSS Selectors</title>
    <style>
      #myId {
        color: blue;
      } /* ID Selector */
      .myClass {
        color: green;
      } /* Class Selector */
    </style>
  </head>
  <body>
    <h2 id="myId">Styled with ID Selector (#)</h2>
    <p class="myClass">Styled with Class Selector (.)</p>
  </body>
</html>
