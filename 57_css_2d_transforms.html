<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS 2D Transforms</title>
    <style>
        div { width: 100px; height: 50px; background-color: pink; border: 1px solid black; transform: rotate(20deg); margin: 50px; }
    </style>
</head>
<body>
    <div>This div is rotated 20 degrees.</div>
</body>
</html>
