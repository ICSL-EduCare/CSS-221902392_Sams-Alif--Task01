<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Overflow</title>
    <style>
        div { width: 200px; height: 50px; background-color: lightgray; overflow: scroll; }
    </style>
</head>
<body>
    <div>This div has a small height and width. Using overflow: scroll allows you to scroll through the content instead of it spilling out.</div>
</body>
</html>
