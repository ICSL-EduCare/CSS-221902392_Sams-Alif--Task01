<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Optimization</title>
    <style>
        /* Unoptimized: 
           margin-top: 10px; margin-right: 15px; margin-bottom: 10px; margin-left: 15px; */
        
        /* Optimized (Shorthand): */
        div { margin: 10px 15px; background: lightgray; padding: 10px; }
    </style>
</head>
<body>
    <div>Using CSS shorthand properties helps optimize load time.</div>
</body>
</html>
