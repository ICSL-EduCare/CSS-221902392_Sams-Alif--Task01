<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Advanced Colors</title>
    <style>
        .rgba-box { background-color: rgba(255, 99, 71, 0.5); padding: 20px; } /* 50% opacity */
        .hex-text { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="rgba-box">This box has a Tomato background with 50% opacity (RGBA).</div>
    <h2 class="hex-text">This text uses a HEX color value.</h2>
</body>
</html>
