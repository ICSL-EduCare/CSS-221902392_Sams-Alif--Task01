<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Custom Fonts</title>
    <style>
        @font-face { font-family: myFirstFont; src: url(sansation_light.woff); }
        div { font-family: myFirstFont, sans-serif; font-size: 22px; }
    </style>
</head>
<body>
    <div>With CSS, websites can finally use fonts other than the pre-selected "web-safe" fonts. (Assuming 'sansation_light.woff' exists)</div>
</body>
</html>
