<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Position</title>
    <style>
        .relative { position: relative; left: 30px; border: 2px solid red; }
        .fixed { position: fixed; bottom: 0; right: 0; border: 2px solid green; }
    </style>
</head>
<body>
    <p class="relative">This paragraph has a relative position.</p>
    <p class="fixed">This is fixed at the bottom right.</p>
</body>
</html>
