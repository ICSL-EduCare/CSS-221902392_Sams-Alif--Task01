<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Text Effects</title>
    <style>
        p.test { white-space: nowrap; width: 200px; border: 1px solid #000000; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <h2>Text-overflow: ellipsis</h2>
    <p class="test">This is some long text that will not fit in the box and will display an ellipsis at the end.</p>
</body>
</html>
