<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS User Interface</title>
    <style>
        div { border: 2px solid black; padding: 20px; width: 200px; resize: both; overflow: auto; outline: 3px dashed red; outline-offset: 5px; }
    </style>
</head>
<body>
    <h2>User Interface (Resize & Outline-offset)</h2>
    <div>You can resize this div by dragging the bottom-right corner.</div>
</body>
</html>
