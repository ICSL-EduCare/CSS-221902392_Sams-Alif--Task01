<!doctype html>
<html lang="en">
  <head>
    <title>CSS Lists</title>
    <style>
      ul.a {
        list-style-type: circle;
      }
      ol.b {
        list-style-type: upper-roman;
      }
    </style>
  </head>
  <body>
    <ul class="a">
      <li>Coffee</li>
      <li>Tea</li>
    </ul>
    <ol class="b">
      <li>First Item</li>
      <li>Second Item</li>
    </ol>
  </body>
</html>
