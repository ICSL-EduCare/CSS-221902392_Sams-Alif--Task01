<!doctype html>
<html lang="en">
  <head>
    <title>CSS Links</title>
    <style>
      a:link {
        color: blue;
        text-decoration: none;
      }
      a:visited {
        color: purple;
      }
      a:hover {
        color: red;
        text-decoration: underline;
      }
      a:active {
        color: green;
      }
    </style>
  </head>
  <body>
    <p>
      <b><a href="#" target="_blank">Hover over this link</a></b> to see it
      change color.
    </p>
  </body>
</html>
