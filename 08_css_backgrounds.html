<!doctype html>
<html lang="en">
  <head>
    <title>CSS Backgrounds</title>
    <style>
      body {
        background-color: lightgray;
      }
      div {
        background-color: white;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>Background Example</h2>
      <p>This div has a white background on a lightgray body.</p>
    </div>
  </body>
</html>
