<!doctype html>
<html lang="en">
  <head>
    <title>CSS Display</title>
    <style>
      li {
        display: inline;
        margin-right: 15px;
      }
      span {
        display: block;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
    <span>This span behaves like a block element.</span>
  </body>
</html>
