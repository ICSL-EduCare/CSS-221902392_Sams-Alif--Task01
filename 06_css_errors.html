<html lang="en">
  <head>
    <title>CSS Errors</title>
    <style>
      p {
        color: blue;
        fnot-size: 20px; /* Error in spelling, browser will ignore this line */
      }
    </style>
  </head>

    <p>

      the rest.
    </p>
  </body>
