<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Max-width</title>
    <style>
        div { max-width: 500px; margin: auto; background-color: lightblue; padding: 20px; }
    </style>
</head>
<body>
    <div>This div has a max-width of 500px. It will resize on smaller screens.</div>
</body>
</html>
