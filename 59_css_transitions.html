<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Transitions</title>
    <style>
        div { width: 100px; height: 100px; background: red; transition: width 2s; }
        div:hover { width: 300px; }
    </style>
</head>
<body>
    <p>Hover over the div element below, to see the transition effect:</p>
    <div></div>
</body>
</html>
