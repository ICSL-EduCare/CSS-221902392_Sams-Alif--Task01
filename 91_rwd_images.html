<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD Images</title>
    <style>
        img.responsive { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h2>Responsive Images</h2>
    <p>This image will scale down if it has to, but never scale up to be larger than its original size.</p>
    <img src="https://via.placeholder.com/800x400" alt="Nature" class="responsive">
</body>
</html>
