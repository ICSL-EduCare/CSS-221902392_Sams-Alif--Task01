<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Inheritance</title>
    <style>
        body { color: blue; }
        span { color: inherit; font-weight: bold; }
    </style>
</head>
<body>
    <p>This text is blue because it inherits from the body. <span>This span also inherits the color!</span></p>
</body>
</html>
