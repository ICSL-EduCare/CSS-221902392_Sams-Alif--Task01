<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Grid Container</title>
    <style>
        .grid-container { display: grid; grid-template-columns: auto auto auto; gap: 10px; background-color: #4CAF50; padding: 10px; }
        .grid-item { background-color: white; border: 1px solid black; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <h2>Grid Container Properties</h2>
    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
    </div>
</body>
</html>
