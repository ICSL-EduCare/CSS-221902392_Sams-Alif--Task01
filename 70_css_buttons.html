<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Buttons</title>
    <style>
        .btn { background-color: #4CAF50; border: none; color: white; padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .btn:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>Styled Button</h2>
    <button class="btn">Click Me!</button>
</body>
</html>
