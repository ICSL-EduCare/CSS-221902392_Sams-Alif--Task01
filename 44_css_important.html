<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS !important</title>
    <style>
        .myClass { color: green !important; }
        #myElement { color: red; }
    </style>
</head>
<body>
    <p id="myElement" class="myClass">This text is green because !important overrides everything.</p>
</body>
</html>
