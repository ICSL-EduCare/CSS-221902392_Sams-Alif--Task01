<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Grid Intro</title>
    <style>
        .grid-container { display: grid; background-color: #2196F3; padding: 10px; }
        .grid-item { background-color: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.8); padding: 20px; font-size: 30px; text-align: center; }
    </style>
</head>
<body>
    <h2>Grid Intro</h2>
    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
    </div>
</body>
</html>
