<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Flexbox Intro</title>
    <style>
        .flex-container { display: flex; background-color: DodgerBlue; }
        .flex-container > div { background-color: #f1f1f1; margin: 10px; padding: 20px; font-size: 30px; }
    </style>
</head>
<body>
    <h2>Flexbox Intro</h2>
    <div class="flex-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
