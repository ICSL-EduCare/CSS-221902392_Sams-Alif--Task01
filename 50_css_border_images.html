<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Border Images</title>
    <style>
        #borderimg { 
            border: 10px solid transparent; 
            padding: 15px; 
            border-image: url('https://www.w3schools.com/css/border.png') 30 round; 
        }
    </style>
</head>
<body>
    <p id="borderimg">This element uses an image as a border.</p>
</body>
</html>
