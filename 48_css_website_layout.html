<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Website Layout</title>
    <style>
        header { background-color: #666; padding: 30px; text-align: center; color: white; }
        section { display: flex; }
        nav { width: 30%; background: #ccc; padding: 20px; }
        article { width: 70%; padding: 20px; }
        footer { background-color: #777; padding: 10px; text-align: center; color: white; }
    </style>
</head>
<body>
    <header><h2>Header</h2></header>
    <section>
        <nav><ul><li>Link</li></ul></nav>
        <article><h2>Main Content</h2><p>Flexbox is used for layout.</p></article>
    </section>
    <footer><p>Footer</p></footer>
</body>
</html>
