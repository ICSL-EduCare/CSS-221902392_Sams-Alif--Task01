<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Gradients</title>
    <style>
        .gradient-box { 
            height: 200px; 
            background-image: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); 
        }
    </style>
</head>
<body>
    <h2>Linear Gradient Example</h2>
    <div class="gradient-box"></div>
</body>
</html>
