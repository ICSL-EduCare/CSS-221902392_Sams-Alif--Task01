<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Image Shapes</title>
    <style>
        .shape { 
            float: left; 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            shape-outside: circle(); 
            margin: 20px; 
            background-color: teal;
        }
    </style>
</head>
<body>
    <div class="shape"></div>
    <p>This text wraps around the circular shape because of the 'shape-outside' property. CSS allows text to wrap around complex shapes rather than just rectangular boxes.</p>
</body>
</html>
